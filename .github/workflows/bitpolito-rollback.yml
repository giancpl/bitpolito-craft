name: BitPolito rollback
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful BitPolito validation run containing the release to restore
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bitpolito-production
  cancel-in-progress: false
jobs:
  rollback:
    if: vars.BITPOLITO_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify the release originated from successful validation on this repository
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$REPO/actions/runs/$RUN_ID" > run.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('run.json'))
          assert run['conclusion']=='success' and run['head_branch']=='main'
          assert run['path']=='.github/workflows/bitpolito-ci.yml'
          assert run['event'] in ('push','workflow_dispatch')
          assert run['head_repository']['full_name']==os.environ['REPO']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('sha='+run['head_sha']+'\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bitpolito-web-${{ steps.release.outputs.sha }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
